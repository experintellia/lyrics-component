name: CI

on:
  push:
    branches: ['**'] # listing tags alone would stop branch pushes from triggering
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # ponytail: pinned because ubuntu-latest becomes 26 on 2026-10-19 and playwright --with-deps may not support it yet; unpin once it does (#8).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: dist/ is up to date (run pnpm build and commit dist/)
        run: git diff --exit-code dist && test -z "$(git status --porcelain dist)"
      - name: dist/ is consumable (strict types without skipLibCheck; ./lrc runs in plain Node)
        run: |
          printf "import { LyricsEditor, type LyricsProps } from '@experintellia/lyrics';\nimport { parseLrc } from '@experintellia/lyrics/lrc';\nexport const x: [typeof LyricsEditor, LyricsProps | null] = [LyricsEditor, null];\nparseLrc('');\n" > consumer.ts
          pnpm exec tsc --ignoreConfig --noEmit --strict --module esnext --moduleResolution bundler --target es2022 --lib es2022,dom --types react consumer.ts
          node -e "import('@experintellia/lyrics/lrc').then((m) => m.parseLrc('[00:01.00]x'))"
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm e2e # builds demo-dist/ (Playwright webServer)
      - run: pnpm screenshots # key UI states at phone and desktop size, for human review
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo-dist

  # ponytail: macOS minutes cost 10x, so only main, release tags and manual runs.
  macos:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      - run: pnpm exec playwright test --project=webkit
      - name: Real Safari smoke test (safaridriver, raw W3C WebDriver)
        run: |
          sudo safaridriver --enable
          pnpm build:demo
          pnpm exec vite preview --port 4173 --strictPort &
          safaridriver -p 4444 &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 http://localhost:4173/ > /dev/null
          curl -s --retry 30 --retry-connrefused --retry-delay 1 http://localhost:4444/status > /dev/null # any HTTP answer = up
          node e2e/safari.mjs

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04 # ponytail: same pin as check (#8)
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
